name: "graph-sync"
description: "Graph Sync using worai by WordLift"
author: "WordLift"
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  profile:
    description: "Profile name defined in worai config"
    required: true
  config_path:
    description: "Optional path passed as --config to worai"
    required: false
    default: ""
  debug:
    description: "Enable --debug (true/false)"
    required: false
    default: "false"
  log_level:
    description: "Optional WORAI_LOG_LEVEL value (debug/info/warning/error)"
    required: false
    default: "warning"
  working_directory:
    description: "Directory where worai should run"
    required: false
    default: "."
  worai_version:
    description: "Pinned worai version to install"
    required: false
    default: "6.20.9"
  install_playwright:
    description: "Install Playwright Python package and browser binaries (true/false)"
    required: false
    default: "true"
  playwright_version:
    description: "Pinned Playwright Python package version to install"
    required: false
    default: "1.58.0"
  playwright_browser:
    description: "Playwright browser to install"
    required: false
    default: "chromium"
  cache_enabled:
    description: "Enable dependency cache for pip and Playwright browser binaries (true/false)"
    required: false
    default: "true"
  cache_key_suffix:
    description: "Optional cache key suffix; when empty, key is derived from worai/playwright versions and browser"
    required: false
    default: ""
  output_dir:
    description: "Output directory for artifacts (reports, debug files). Defaults to $GITHUB_WORKSPACE/output/<profile>."
    required: false
    default: ""
  memory_gib:
    description: "Available memory in GiB passed to the resource monitor."
    required: false
    default: "4"
  graph_kpis_enabled:
    description: "After a successful sync, export the graph, calculate KPIs, and upload a graph KPI snapshot (true/false)."
    required: false
    default: "false"
  graph_kpis_snapshot_date:
    description: "Snapshot date for the graph KPI upload. Defaults to the current UTC date."
    required: false
    default: ""
  graph_kpis_api_url:
    description: "Base URL for WordLift graph KPI APIs."
    required: false
    default: "https://api.wordlift.io"
  graph_kpis_allowed_hosts:
    description: "Comma-separated HTTPS host allowlist for graph KPI API and export endpoints."
    required: false
    default: "api.wordlift.io"
  graph_kpis_export_endpoint:
    description: "Optional WordLift graph export endpoint override. Defaults to worai's graph export endpoint."
    required: false
    default: ""
  graph_kpis_timeout_seconds:
    description: "Maximum seconds for graph KPI calculation/upload and WordLift API requests."
    required: false
    default: "300"
  graph_kpis_shacl_workers:
    description: "Max worker threads for URL-level SHACL validation."
    required: false
    default: "4"
  graph_kpis_shape:
    description: "Comma-separated extra SHACL shape files for graph KPI validation."
    required: false
    default: ""
  graph_kpis_no_builtin_shapes:
    description: "Use only shapes passed with graph_kpis_shape for graph KPI validation (true/false)."
    required: false
    default: "false"
  graph_kpis_fail_on_error:
    description: "Fail the action when graph KPI export, calculation, or upload fails (true/false). Defaults to warning-only."
    required: false
    default: "false"
  graph_kpis_retry_attempts:
    description: "Deprecated; native worai graph kpis push owns upload behavior."
    required: false
    default: "3"

runs:
  using: "composite"
  steps:
    - name: Resolve cache settings
      id: resolve_cache
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/resolve-cache-key.sh"
      env:
        INPUT_CACHE_ENABLED: ${{ inputs.cache_enabled }}
        INPUT_CACHE_KEY_SUFFIX: ${{ inputs.cache_key_suffix }}
        INPUT_WORAI_VERSION: ${{ inputs.worai_version }}
        INPUT_PLAYWRIGHT_VERSION: ${{ inputs.playwright_version }}
        INPUT_PLAYWRIGHT_BROWSER: ${{ inputs.playwright_browser }}

    - name: Cache pip and Playwright binaries
      if: ${{ steps.resolve_cache.outputs.cache_enabled == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-graph-sync-${{ steps.resolve_cache.outputs.cache_key_suffix }}
        restore-keys: |
          ${{ runner.os }}-graph-sync-

    - name: Install worai
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/install-worai.sh"
      env:
        INPUT_WORAI_VERSION: ${{ inputs.worai_version }}

    - name: Install Playwright
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/install-playwright.sh"
      env:
        INPUT_INSTALL_PLAYWRIGHT: ${{ inputs.install_playwright }}
        INPUT_PLAYWRIGHT_VERSION: ${{ inputs.playwright_version }}
        INPUT_PLAYWRIGHT_BROWSER: ${{ inputs.playwright_browser }}

    - name: Start resource monitor
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/start-monitor-resources.sh"
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_MEMORY_GIB: ${{ inputs.memory_gib }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}

    - name: Run worai graph sync run
      id: run_worai
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/run-worai.sh"
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_LOG_LEVEL: ${{ inputs.log_level }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}

    - name: Export, calculate, and upload graph KPIs
      if: ${{ success() }}
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/run-graph-kpis.sh"
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_LOG_LEVEL: ${{ inputs.log_level }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_GRAPH_KPIS_ENABLED: ${{ inputs.graph_kpis_enabled }}
        INPUT_GRAPH_KPIS_SNAPSHOT_DATE: ${{ inputs.graph_kpis_snapshot_date }}
        INPUT_GRAPH_KPIS_API_URL: ${{ inputs.graph_kpis_api_url }}
        INPUT_GRAPH_KPIS_ALLOWED_HOSTS: ${{ inputs.graph_kpis_allowed_hosts }}
        INPUT_GRAPH_KPIS_EXPORT_ENDPOINT: ${{ inputs.graph_kpis_export_endpoint }}
        INPUT_GRAPH_KPIS_TIMEOUT_SECONDS: ${{ inputs.graph_kpis_timeout_seconds }}
        INPUT_GRAPH_KPIS_SHACL_WORKERS: ${{ inputs.graph_kpis_shacl_workers }}
        INPUT_GRAPH_KPIS_SHAPE: ${{ inputs.graph_kpis_shape }}
        INPUT_GRAPH_KPIS_NO_BUILTIN_SHAPES: ${{ inputs.graph_kpis_no_builtin_shapes }}
        INPUT_GRAPH_KPIS_FAIL_ON_ERROR: ${{ inputs.graph_kpis_fail_on_error }}
        INPUT_GRAPH_KPIS_RETRY_ATTEMPTS: ${{ inputs.graph_kpis_retry_attempts }}

    - name: Collect resource monitor report
      if: always()
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/collect-monitor-resources.sh"
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}

    - name: Publish sync report to job summary
      if: always()
      shell: bash
      run: |
        report="${{ steps.run_worai.outputs.output_dir }}/graph_sync_report.md"
        if [ -f "$report" ]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Graph Sync Report — ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Report not produced." >> "$GITHUB_STEP_SUMMARY"
        fi
        memory_report="${{ steps.run_worai.outputs.output_dir }}/memory_report.md"
        if [ -f "$memory_report" ]; then
          cat "$memory_report" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Memory report — ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Monitor did not produce output." >> "$GITHUB_STEP_SUMMARY"
        fi
        graph_kpi_report="${{ steps.run_worai.outputs.output_dir }}/graph-kpis/graph_kpi_report.md"
        if [ -f "$graph_kpi_report" ]; then
          cat "$graph_kpi_report" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload sync report
      if: always()
      # A failed/blocked upload (e.g. GitHub Actions storage quota full) must NOT fail an
      # otherwise-successful sync — the KG is already written; the artifact is only a receipt.
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: graph-sync-report-${{ inputs.profile }}
        # Keep receipts only a week (was the 90-day default) to stop storage from filling.
        retention-days: 7
        # Upload only the small human-readable reports. Deliberately excludes the large
        # graph-kpis/graph_kpis.json (per-URL SHACL/KPI details) — the summary
        # graph_kpi_report.md is kept instead. This is what keeps the storage bill flat.
        path: |
          ${{ steps.run_worai.outputs.output_dir }}/graph_sync_report.md
          ${{ steps.run_worai.outputs.output_dir }}/graph_sync_failures.csv
          ${{ steps.run_worai.outputs.output_dir }}/memory_report.md
          ${{ steps.run_worai.outputs.output_dir }}/graph-kpis/graph_kpi_report.md
        if-no-files-found: ignore
